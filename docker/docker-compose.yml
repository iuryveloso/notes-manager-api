services:
  api:
    build:
      args:
        user: ${USER_API}
        uid: 1000
      context: ./php
      dockerfile: Dockerfile
    image: notes_manager_api
    container_name: notes_manager_api
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ${API_DIRECTORY}:/var/www
    networks:
      - notes_manager
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: notes_manager-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - notes_manager
  nginx:
    image: nginx:1.27
    container_name: notes_manager-nginx
    restart: unless-stopped
    ports:
      - ${API_PORT}:80
    volumes:
      - ${API_DIRECTORY}:/var/www
      - ./nginx:/etc/nginx/conf.d
    networks:
      - notes_manager
    depends_on:
      - api
  web_app:
    build:
      args:
        user: ${USER_WEB_APP}
      context: ./node
      dockerfile: Dockerfile
    image: notes_manager-web_app
    container_name: notes_manager-web-app
    volumes:
      - ${APP_DIRECTORY}:/web_app
    networks:
      - notes_manager
    working_dir: /web_app
    ports:
      - ${APP_PORT}:${APP_PORT}
    command: bash -c "npm install && npm run build && npm run start"
    depends_on:
      - api
networks:
  notes_manager:
    driver: bridge
volumes:
  mysql_data: